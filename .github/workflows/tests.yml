name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile fdvh.py k_claims_synth.py scripts/*.py tests/*.py
      - name: Test
        run: python -m unittest discover -s tests -v
